<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Renki auth test</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 900px;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        white-space: pre-wrap;
        word-break: break-all;
        border-radius: 6px;
      }
      h3 {
        margin-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Renki auth test</h1>

    <!-- No `hd` attribute on purpose: it only filters the account chooser.
         Leaving it off lets you test a personal Gmail and confirm the server
         returns 403 — the check that actually matters. -->
    <div
      id="g_id_onload"
      data-client_id="688415277180-hk7pj4dt1dfp2rcdap4b5afkctihumbq.apps.googleusercontent.com"
      data-callback="onGoogleCredential"
      data-auto_prompt="false"
    ></div>
    <div class="g_id_signin" data-type="standard" data-size="large"></div>

    <h3>Google ID token (paste into curl)</h3>
    <pre id="token">sign in above…</pre>

    <h3>POST /api/auth/google</h3>
    <pre id="result">—</pre>

    <script>
      async function onGoogleCredential(response) {
        document.getElementById('token').textContent = response.credential;
        console.log('ID token:', response.credential);

        const result = document.getElementById('result');
        result.textContent = 'posting…';
        try {
          const res = await fetch('http://localhost:4000/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ googleToken: response.credential }),
          });
          const body = await res.json();
          result.textContent = res.status + '\n\n' + JSON.stringify(body, null, 2);
        } catch (err) {
          result.textContent = 'fetch failed: ' + err;
        }
      }
    </script>
  </body>
</html>
