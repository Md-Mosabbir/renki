name: Production smoke test

# What is actually live, right now — checked against the running site rather
# than against a commit.
#
# These three assertions survive from the old deploy.yml. Nothing here can be a
# unit test: each one is about how the production ENVIRONMENT is configured, and
# every one of them passes locally while being wrong in production.
#
# It no longer gates a release, because nothing does — Render and Vercel deploy
# on a push to main by themselves. So this runs on a schedule instead: it cannot
# stop a bad deploy, it can only tell you that one happened. Run it by hand
# after any change to NODE_ENV, the start command, or route mounting.
on:
  schedule:
    # 03:00 UTC daily — roughly 09:00 in Dhaka, so a failure is waiting when
    # somebody starts work rather than at 3am local.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public endpoints behave
    runs-on: ubuntu-latest
    steps:
      - name: Check the live API
        env:
          API: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API:-}" ]; then
            echo "::error::PRODUCTION_API_URL is not set (Settings -> Secrets and variables -> Actions -> Variables)"
            exit 1
          fi

          API="$(printf '%s' "$API" | tr -d '[:space:]')"
          API="${API%/}"

          echo "health:"
          curl -fsS "$API/api/health"
          echo ""

          # Auth must be enforced. A 200 here would mean requireAuth stopped
          # being mounted, which no unit test can catch.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/friends")
          [ "$code" = "401" ] || { echo "::error::/api/friends returned $code, expected 401"; exit 1; }
          echo "protected routes reject anonymous callers"

          # The development auth bypass must not exist in production. This is
          # the single most important line in this file: routes/index.ts mounts
          # /api/dev only when NODE_ENV is not production, and a mistake there
          # is a login-as-anyone endpoint on the public internet.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/dev/login")
          [ "$code" = "404" ] || { echo "::error::/api/dev/login returned $code, expected 404"; exit 1; }
          echo "dev auth bypass is absent"
