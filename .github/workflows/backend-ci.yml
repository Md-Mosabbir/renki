name: Backend CI

# Path-filtered to the backend workspace. A frontend-only or docs-only commit
# never triggers this run — that is what keeps the monorepo from making every
# push pay for every project's CI.
on:
  # Both triggers, same filter. Render and Vercel own the RELEASE — each
  # deploys on a push to main through its own git integration — so this
  # workflow's job is to say whether what landed was any good, not to gate it.
  #
  # That means a red main is possible: the platform ships as fast as it ever
  # did and this run goes red afterwards. Branch protection on main is what
  # closes that, by refusing the merge while the PR run is red.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# A second push to the same branch cancels the first run still in flight.
# Never cancel on main — those runs are the record of what actually landed.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # One lockfile at the repo root — npm workspaces hoists everything.
          cache-dependency-path: package-lock.json

      # ci, not install: installs exactly what package-lock.json pins and fails
      # if the lockfile and package.json have drifted apart. Run from the root
      # so every workspace is linked.
      - name: Install dependencies
        run: npm ci

      # Prettier config lives at the root and covers every workspace.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint -w @renki/backend

      # tsx strips types without checking them, so this is the first and only
      # place type errors are caught. Do not remove it.
      - name: Typecheck
        run: npm run typecheck -w @renki/backend

      - name: Build
        run: npm run build -w @renki/backend

      # Unit tests only — nothing here touches Postgres, so no service container
      # is needed. vitest.config.ts supplies dummy values for the env vars that
      # env.ts refuses to default, which is the only reason importing the app
      # does not throw here.
      #
      # Note vitest exits 1 when it finds no test files at all, deliberately:
      # a run that silently passes because the tests stopped being discovered is
      # worse than a red build.
      - name: Test
        run: npm test -w @renki/backend

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    # Only worth the minutes if the code itself is sound.
    needs: quality

    # A throwaway Postgres for the smoke test. Credentials match .env.example so
    # the connection string below is the one developers already recognise.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renki
          POSTGRES_PASSWORD: renki
          POSTGRES_DB: renki
        ports:
          - 5432:5432
        # Without this the job races the database and the smoke test flakes.
        options: >-
          --health-cmd "pg_isready -U renki -d renki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Context is the repo root, not backend/ — the Dockerfile needs the
      # workspace lockfile, which only exists there.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: renki-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the real production image against a real Postgres and polls
      # /api/health, which returns 503 unless the database answers. Catches both
      # "image builds but the server crashes on startup" and "the server starts
      # but cannot reach its database".
      #
      # --network host so the container can reach the service container on
      # localhost:5432, and so port 4000 is directly reachable from the runner.
      - name: Smoke test the image
        run: |
          docker run -d --name renki-ci --network host \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e CORS_ORIGIN=http://localhost:3000 \
            -e DATABASE_URL=postgresql://renki:renki@localhost:5432/renki \
            -e CLIENT_ID=ci-not-a-real-client-id \
            -e JWT_SECRET=ci-not-a-real-secret \
            -e JWT_EXPIRES_IN=7d \
            -e ALLOWED_EMAIL_DOMAIN=northsouth.edu \
            renki-backend:ci

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/api/health; then
              echo ""
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check never came up"
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs renki-ci || true
