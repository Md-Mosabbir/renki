services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renki
      POSTGRES_PASSWORD: renki
      POSTGRES_DB: renki
    ports:
      # Published on 5433, NOT 5432, because Ubuntu's postgres service starts on
      # boot and already owns 5432. Publishing there would fail to bind — and
      # worse, when this container is stopped, localhost:5432 would silently fall
      # through to that system database, which has no renki tables.
      #
      # Left side is the host port, right side is inside the container. The
      # container keeps 5432, so the `db:5432` URL the api service uses below is
      # unaffected by this.
      - '5433:5432'
    volumes:
      - renki-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U matters: without it pg_isready checks the `root` user and reports
      # healthy before the renki role and database actually exist.
      test: ['CMD-SHELL', 'pg_isready -U renki -d renki']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # Root context so the workspace lockfile is visible to npm ci.
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        # Wait for the healthcheck, not just for the container to exist —
        # otherwise the API boots first and its startup probe reports UNREACHABLE.
        condition: service_healthy
    ports:
      - '4000:4000'
    # Compose's own `${VAR}` interpolation only reads a .env at the repo root,
    # and the real one lives in backend/. Load it here instead; `environment:`
    # below still wins for the keys it sets, so DATABASE_URL stays compose-local.
    # required: false — backend/.env is git-ignored and may not exist yet.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      # Host is `db`, not localhost: inside the compose network each service is
      # reachable by its service name. Port is 5432, the container's port, not
      # the published one.
      DATABASE_URL: postgresql://renki:renki@db:5432/renki
      # CLIENT_ID and JWT_SECRET come from env_file above — env.ts gives them no
      # fallback, so the container refuses to boot without them rather than
      # accepting tokens minted for any Google app.
      JWT_EXPIRES_IN: 7d
      ALLOWED_EMAIL_DOMAIN: northsouth.edu
    volumes:
      # Mount the source for live reload, but keep the container's own
      # node_modules so host/linux binaries never clash.
      - ./backend/src:/app/backend/src
      # Migrations and seeds sit outside src/ (see backend/Dockerfile), so they
      # need their own mounts or a new .sql on the host stays invisible in here.
      - ./backend/migrations:/app/backend/migrations
      - ./backend/seeds:/app/backend/seeds
      - /app/node_modules

  web:
    build:
      # Root context so the workspace lockfile is visible to npm ci.
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      # Only so the API is up before the first request; the dev server itself
      # does not need it to boot, and Next renders fine without a live backend.
      - api
    ports:
      - '3000:3000'
    environment:
      # In the browser, not in the container: this URL is fetched by the user's
      # own machine, so it must be the PUBLISHED host address. `http://api:4000`
      # resolves only inside the compose network and would fail in the browser.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    env_file:
      # NEXT_PUBLIC_GOOGLE_CLIENT_ID lives here. Same file the local dev server
      # reads, so the two cannot drift apart.
      - path: ./frontend/.env.local
        required: false
    volumes:
      # Source for hot reload, but keep the container's own node_modules and
      # .next so host/linux binaries and build output never clash.
      - ./frontend:/app/frontend
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next

volumes:
  renki-pgdata:
