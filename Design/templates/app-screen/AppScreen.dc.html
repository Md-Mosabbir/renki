<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Renki app screen" description="Mobile app screen frame: wordmark bar, serif title, state banner, option rows, bottom nav." -->
<helmet><script src="./ds-base.js"></script><script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.js"></script><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Instrument+Serif&display=swap');body{margin:0}</style></helmet>
<div style="display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:#ffffff;color:#0a0a0a;font-family:'Geist',system-ui,sans-serif;font-size:14px;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid oklch(0.922 0 0)">
    <div style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;background:#ea4e05"></span><span style="font-size:14px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase">Renki</span></div>
    <span style="width:6px;height:6px;background:#ea4e05"></span>
  </div>
  <div style="flex:1;overflow-y:auto;padding:32px 24px 40px;display:flex;flex-direction:column;gap:40px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.556 0 0)">Good evening</p>
      <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1.1;letter-spacing:-0.02em">Sadia</h1>
    </div>
    <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
      <section style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-left:2px solid #ea4e05;background:oklch(0.957 0.035 55)">
        <i data-lucide="shield-check" style="width:16px;height:16px;color:#ea4e05;flex-shrink:0"></i>
        <p style="margin:0;font-size:13px;color:oklch(0.269 0 0);line-height:1.4">Matched only with female riders</p>
      </section>
    </sc-if>
    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase">Find a ride</h2>
      <div style="display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid oklch(0.922 0 0)">
        <i data-lucide="search" style="width:18px;height:18px;color:oklch(0.556 0 0);flex-shrink:0"></i>
        <span style="flex:1;font-size:15px;font-weight:500">Match with a stranger</span>
        <span style="color:oklch(0.556 0 0)">→</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid oklch(0.922 0 0)">
        <i data-lucide="users" style="width:18px;height:18px;color:oklch(0.556 0 0);flex-shrink:0"></i>
        <span style="flex:1;font-size:15px;font-weight:500">Ride with friends</span>
        <span style="color:oklch(0.556 0 0)">→</span>
      </div>
    </section>
    <sc-if value="{{ showRecent }}" hint-placeholder-val="{{ true }}">
      <section style="display:flex;flex-direction:column;gap:12px">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase">Recent rides</h2>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid oklch(0.922 0 0)">
          <span style="display:flex;align-items:center;gap:8px;font-size:14px"><span style="width:10px;height:10px;background:oklch(0.922 0 0)"></span>NSU <span style="color:oklch(0.556 0 0)">→</span> Dhanmondi 27</span>
          <span style="font-family:'Geist Mono',monospace;font-size:12px;color:oklch(0.556 0 0)">9 Mar, 6:40 PM</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid oklch(0.922 0 0)">
          <span style="display:flex;align-items:center;gap:8px;font-size:14px"><span style="width:10px;height:10px;background:oklch(0.922 0 0)"></span>Banani 11 <span style="color:oklch(0.556 0 0)">→</span> NSU</span>
          <span style="font-family:'Geist Mono',monospace;font-size:12px;color:oklch(0.556 0 0)">7 Mar, 8:15 AM</span>
        </div>
      </section>
    </sc-if>
  </div>
  <nav style="border-top:1px solid oklch(0.922 0 0);background:#ffffff">
    <div style="display:flex;max-width:430px;margin:0 auto">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px"><i data-lucide="car" style="width:20px;height:20px"></i><span style="font-size:11px;font-weight:500">Rides</span><span style="height:2px;width:24px;background:#ea4e05"></span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:oklch(0.556 0 0)"><i data-lucide="users" style="width:20px;height:20px"></i><span style="font-size:11px;font-weight:500">Friends</span><span style="height:2px;width:24px;background:transparent"></span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:oklch(0.556 0 0)"><i data-lucide="users-round" style="width:20px;height:20px"></i><span style="font-size:11px;font-weight:500">Groups</span><span style="height:2px;width:24px;background:transparent"></span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:oklch(0.556 0 0)"><i data-lucide="history" style="width:20px;height:20px"></i><span style="font-size:11px;font-weight:500">History</span><span style="height:2px;width:24px;background:transparent"></span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:oklch(0.556 0 0)"><i data-lucide="user" style="width:20px;height:20px"></i><span style="font-size:11px;font-weight:500">Profile</span><span style="height:2px;width:24px;background:transparent"></span></div>
    </div>
  </nav>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:844},&quot;showBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showRecent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (window.lucide) window.lucide.createIcons();
  }
  componentDidUpdate() {
    if (window.lucide) window.lucide.createIcons();
  }
  renderVals() {
    return {
      showBanner: this.props.showBanner ?? true,
      showRecent: this.props.showRecent ?? true,
    };
  }
}

</script>
</body>
</html>
