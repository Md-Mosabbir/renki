<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:var(--ink-950);display:grid;place-items:center}
.name{font-family:var(--font-display);font-weight:400;font-size:200px;line-height:1;letter-spacing:-0.01em;color:var(--ink-0);display:flex;align-items:center;gap:44px}
.sq{width:120px;height:120px;background:var(--brand)}
.strip{flex:1;display:flex;flex-direction:column}.strip>div{flex:1}</style></head>
<body>
<div class="main"><div class="name"><span class="sq"></span>Renki</div></div>
<div class="strip">
  <div style="background:var(--brand-muted)"></div>
  <div style="background:var(--brand)"></div>
  <div style="background:var(--destructive)"></div>
  <div style="background:var(--brand-strong)"></div>
</div>
</body></html>
