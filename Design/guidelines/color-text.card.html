<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:center}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.g{display:grid;gap:8px}</style></head><body><div class="g">
 <p style="margin:0;color:var(--text-body);font-size:15px">Get home with someone from campus. <span class="k">--text-body</span></p>

 <p style="margin:0;color:var(--text-accent);font-size:15px">Change who you are matched with <span class="k">--text-accent</span></p>

</div></body></html>
