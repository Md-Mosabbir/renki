<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:center}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.s{height:96px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px}</style></head><body><div class="g">
 <div class="s" style="background:var(--background);box-shadow:var(--ring-1)">--background</div>
 <div class="s" style="background:var(--paper);box-shadow:var(--ring-1)">--paper</div>
 <div class="s" style="background:var(--surface-muted)">--surface-muted</div>
 <div class="s" style="background:var(--surface-inverse);color:var(--text-inverse)">--surface-inverse</div>
</div></body></html>
