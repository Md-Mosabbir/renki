<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:center}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.b{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:stretch}.big{background:var(--brand);height:110px;display:flex;align-items:flex-end;padding:8px;color:var(--brand-foreground);font-family:var(--font-mono);font-size:10px}.tints{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tint{height:110px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px}</style></head><body><div class="b"><div class="big">--brand<br>oklch(0.632 0.208 38.5)</div><div class="tints">
 <div class="tint" style="background:var(--brand-strong);color:#fff">--brand-strong</div>
 <div class="tint" style="background:var(--brand-muted);color:var(--brand-strong)">--brand-muted</div>
 <div class="tint" style="background:var(--brand-foreground);color:var(--text-body);box-shadow:var(--ring-1)">--brand-foreground</div>
</div></div></body></html>
