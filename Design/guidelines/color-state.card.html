<!-- @dsCard group="Colors" viewport="700x150" name="State colors" subtitle="Destructive is a tint plus text, never a filled red button." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:center}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.s{padding:12px;font-size:12px}</style></head><body><div class="g">
 <div class="s" style="background:color-mix(in oklch,var(--destructive) 10%,transparent);color:var(--destructive);border-left:2px solid var(--destructive)"><b>Account suspended</b><br><span class="k" style="color:inherit">--destructive @ 10%</span></div>
 <div class="s" style="background:var(--brand-muted);color:var(--brand-strong);border-left:2px solid var(--brand)"><b>Confirmed by a moderator</b><br><span class="k" style="color:inherit">--brand-muted</span></div>
 <div class="s" style="background:color-mix(in oklch,var(--muted) 40%,transparent);border-left:2px solid var(--border)"><b>Waiting on replies</b><br><span class="k">--muted @ 40%</span></div>
</div></body></html>
