<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.row{display:flex;gap:14px;align-items:center}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.s{background:var(--surface-card);padding:16px;font-size:12px;height:76px}</style></head><body><div class="g">
  <div class="s" style="box-shadow:var(--ring-1)">--ring-1<br><span class="k">every card in the flow</span></div>
  <div class="s" style="box-shadow:var(--shadow-float)">--shadow-float<br><span class="k">toast, install banner</span></div>
  <div class="s" style="box-shadow:var(--shadow-sheet)">--shadow-sheet<br><span class="k">bottom sheet only</span></div>
 </div></body></html>
