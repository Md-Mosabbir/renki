<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px;background:var(--paper)}.cols{display:grid;grid-template-columns:1.15fr 0.85fr;gap:28px;align-items:start}.stack{display:grid;gap:16px}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}ul{margin:0;padding:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const D = window.RenkiDesignSystem_4a6e65;
const { StatusBanner, RideOption, GroupCard, FriendRow, SwipeCard, NavShell, Button, Tabs } = D;
const ic = (n,s=16)=><i data-lucide={n} style={{width:s,height:s}}></i>;
const NAV=[{href:'/rides',label:'Rides',icon:ic('car',20)},{href:'/friends',label:'Friends',icon:ic('users',20)},{href:'/groups',label:'Groups',icon:ic('users-round',20)},{href:'/history',label:'History',icon:ic('history',20)},{href:'/profile',label:'Profile',icon:ic('user',20)}];
function Demo(){return (
<div className="cols">
  <div className="stack">
    <StatusBanner tone="brand" icon={ic('shield-check',20)} title="Sadia" body="North South University · matched only with female riders" action={<a href="#" style={{fontSize:'var(--text-xs)',fontWeight:500}}>Change who you are matched with</a>}/>
    <RideOption icon={ic('search',20)} title="Match with a stranger" body="One other rider leaving campus around the same time. You both swipe; a ride happens only if you both say yes."/>
    <GroupCard origin="NSU" destination="Dhanmondi 27" departure="Fri 14 Mar, 6:30 PM" status="matched" highlighted members={[{name:'Sadia Rahman',organiser:true},{name:'Imran Kabir'},{name:'Tanvir Hossain',status:'pending'}]} footer={<><Button size="sm" square>Start ride</Button><Button size="sm" variant="ghost">Cancel ride</Button></>}/>
    <div><div className="lbl" style={{marginBottom:8}}>People</div><ul><FriendRow name="Sadia Rahman" note="Met 3 Mar"><Button size="sm" variant="outline">Remove</Button></FriendRow><FriendRow name="Imran Kabir" note="Wants to be friends"><Button size="sm">Accept</Button></FriendRow></ul></div>
    <NavShell items={NAV} active="/rides"/>
  </div>
  <div className="stack">
    <div className="lbl">Match deck</div>
    <div style={{height:360}}><SwipeCard name="Imran Kabir" badge={{label:'Wants to ride with you',accepted:true}} intent="yes" offset={26} facts={[{icon:ic('flag'),label:'Waiting at',value:'NSU gate 1'},{icon:ic('map-pin'),label:'Going to',value:'Dhanmondi 27'},{icon:ic('navigation'),label:'From your drop-off',value:'0.8 km away'},{icon:ic('clock'),label:'Leaving',value:'6:30 PM · 5 min from yours'}]}/></div>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
</script></body></html>
