<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px;background:var(--paper)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:start}.cell{display:grid;gap:12px;justify-items:start}.lbl{font:var(--type-label);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}.plate{background:var(--ink-950);padding:20px;display:grid;place-items:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { Wordmark, Mark, AppLoader, SearchingRings, CodePlate } = window.RenkiDesignSystem_4a6e65;
function Demo(){return (
<div className="grid">
  <div className="cell"><span className="lbl">Wordmark</span><Wordmark/><Wordmark size="lg"/>
    <div className="plate" style={{justifySelf:'stretch'}}><Wordmark tone="inverse"/></div></div>
  <div className="cell"><span className="lbl">Mark</span>
    <div style={{display:'flex',gap:10,alignItems:'center'}}><Mark size="sm"/><Mark/><Mark size="lg"/><Mark tone="ink"/><Mark tone="muted"/></div>
    <img src="../../assets/logo.svg" width="72" height="72" alt="Renki app icon"/></div>
  <div className="cell" style={{justifyItems:'center'}}><span className="lbl" style={{justifySelf:'start'}}>Loading · searching</span>
    <AppLoader label="Loading"/><SearchingRings label="Looking for riders" sublabel="Leaving around 6:30 PM"/></div>
  <div className="cell"><span className="lbl">Code plate</span><CodePlate size={120} caption="Expires in 90s"/></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
